  <body>
    <!--
      DESIGN NOTES

      GROUND    Warm paper, #f6f1e6 to #efe6d3, with a sand pool at the floor of
                the hero. Warm-black ink, never pure #000.

      COLOUR    Two primaries and no third: indigo #232a5c for the institutional
                register, clay #9e4e12 for the warm one, each with a tint used for
                card surfaces. The one exception is the sign-in showcase, whose
                four-hue illustration palette is scoped to that panel so it cannot
                reach UI chrome.

      TYPE      Satoshi throughout. 900 for display, 500 for text. One family.

      SHAPE     Every control is a pill. Cards carry a hairline and a real offset
                shadow, never a flat border alone.

      RULES     Colour never carries meaning on its own — status has a label,
                selected states carry a tick. Contrast is measured and written in
                a comment beside each colour. Motion animates from an
                already-visible state and honours prefers-reduced-motion.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
